name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Render and monitor logic checks
        shell: pwsh
        run: ./scripts/test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LiveDesktop-windows-x64
          path: artifacts/app/
